name: Build and push docker image
on:
  workflow_dispatch:
    inputs:
      environment: 
        description: Select environment
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha

      - name: Docker login to fintlabs container registry
        if: ${{ inputs.environment == 'prod' }}
        uses: docker/login-action@v4.8.0
        with:
          registry: fintlabsacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Docker login to github container registry
        if: ${{ inputs.environment == 'prod' }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ inputs.environment == 'prod' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print docker tag
        run: echo 'Docker-tag er ${{ steps.meta.outputs.tags }} ' >> $GITHUB_STEP_SUMMARY
